name: test-and-deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          GITHUB_NOTIFY_ACTIONS: ${{ vars.GITHUB_NOTIFY_ACTIONS }}
          DATA_DIR: ${{ vars.DATA_DIR || '/var/lib/git-notify' }}
        run: |
          {
            echo "DISCORD_TOKEN=$DISCORD_TOKEN"
            echo "DISCORD_GUILD_ID=$DISCORD_GUILD_ID"
            echo "WEBHOOK_PORT=8080"
            echo "GITHUB_WEBHOOK_SECRET=$GITHUB_WEBHOOK_SECRET"
            echo "GITHUB_NOTIFY_ACTIONS=$GITHUB_NOTIFY_ACTIONS"
            echo "USER_STORE_PATH=data/users.json"
            echo "DATA_DIR=$DATA_DIR"
          } > .env
      - run: docker compose up -d --build
