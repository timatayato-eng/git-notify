name: test-and-deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          DISCORD_USER_MAP: ${{ vars.DISCORD_USER_MAP }}
          DISCORD_WEBHOOK_USERNAME: ${{ vars.DISCORD_WEBHOOK_USERNAME || 'GitHub' }}
        run: |
          {
            echo "DISCORD_WEBHOOK_URL=$DISCORD_WEBHOOK_URL"
            echo "DISCORD_WEBHOOK_USERNAME=$DISCORD_WEBHOOK_USERNAME"
            echo "WEBHOOK_PORT=8080"
            echo "GITHUB_WEBHOOK_SECRET=$GITHUB_WEBHOOK_SECRET"
            echo "DISCORD_USER_MAP=$DISCORD_USER_MAP"
          } > .env
      - run: docker compose up -d --build
