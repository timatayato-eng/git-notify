stages:
  - build
  - deploy

building:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
      when: on_success
    - when: never
  script:
    - cp .env.default .env
    - docker compose build
  tags:
    - prod

deploying:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
    - when: never
  needs: ["building"]
  script:
    - cp .env.default .env
    - docker compose up -d
  tags:
    - prod

